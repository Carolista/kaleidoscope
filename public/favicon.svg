<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.04 -1.04 2.08 2.08">
	<title>Kaleidoscope</title>
	<g stroke="#ffffff" stroke-width="0" stroke-linejoin="round">
		<polygon
			id="petal-top"
			fill="#c94444"
			points="0,0 0.2071067812,-0.5 0,-1 -0.2071067812,-0.5"
		/>
		<polygon
			id="petal-upper-right"
			fill="#e3772a"
			points="0,0 0.2071067812,-0.5 0,-1 -0.2071067812,-0.5"
			transform="rotate(60)"
		/>
		<polygon
			id="petal-lower-right"
			fill="#e5b218"
			points="0,0 0.2071067812,-0.5 0,-1 -0.2071067812,-0.5"
			transform="rotate(120)"
		/>
		<polygon
			id="petal-bottom"
			fill="#4c9e1c"
			points="0,0 0.2071067812,-0.5 0,-1 -0.2071067812,-0.5"
			transform="rotate(180)"
		/>
		<polygon
			id="petal-lower-left"
			fill="#2184c7"
			points="0,0 0.2071067812,-0.5 0,-1 -0.2071067812,-0.5"
			transform="rotate(240)"
		/>
		<polygon
			id="petal-upper-left"
			fill="#963dca"
			points="0,0 0.2071067812,-0.5 0,-1 -0.2071067812,-0.5"
			transform="rotate(300)"
		/>
	</g>
</svg>
