name: CI & Deploy

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

# Avoid two deploys racing each other if main gets multiple pushes quickly.
concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    test:
        name: Lint, format, test, build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 20
                  cache: npm
            - name: Authenticate with Font Awesome
              env:
                  FONT_AWESOME_AUTH_TOKEN: ${{ secrets.FONT_AWESOME_AUTH_TOKEN }}
              run: |
                  if [ -z "$FONT_AWESOME_AUTH_TOKEN" ]; then
                    echo "::error::FONT_AWESOME_AUTH_TOKEN is not set. Add it as a repository Actions secret; environment secrets are not available to this job."
                    exit 1
                  fi
            - name: Install dependencies
              env:
                  FONT_AWESOME_AUTH_TOKEN: ${{ secrets.FONT_AWESOME_AUTH_TOKEN }}
              run: npm ci
            - run: npm run lint
            - run: npm run format:check
            - run: npm run test -- --run
            - run: npm run build
            - uses: actions/upload-artifact@v4
              with:
                  name: dist
                  path: dist

    deploy:
        name: Deploy to GitHub Pages
        needs: test
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/download-artifact@v4
              with:
                  name: dist
                  path: dist
            - uses: actions/configure-pages@v5
            - uses: actions/upload-pages-artifact@v3
              with:
                  path: dist
            - id: deployment
              uses: actions/deploy-pages@v4
