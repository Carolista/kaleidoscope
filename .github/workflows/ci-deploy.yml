name: CI & Deploy

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

# Avoid two deploys racing each other if main gets multiple pushes quickly.
concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    test:
        name: Lint, format, test, build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 20
                  cache: npm
            - name: Authenticate with Font Awesome
              run: |
                  npm config set "@fortawesome:registry" https://npm.fontawesome.com/
                  npm config set "//npm.fontawesome.com/:_authToken" ${{ secrets.FONT_AWESOME_AUTH_TOKEN }}
            - name: Install dependencies
              run: npm ci
            - run: npm run lint
            - run: npm run format:check
            - run: npm run test -- --run
            - run: npm run build
            - uses: actions/upload-artifact@v4
              with:
                  name: dist
                  path: dist

    deploy:
        name: Deploy to GitHub Pages
        needs: test
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/download-artifact@v4
              with:
                  name: dist
                  path: dist
            - uses: actions/configure-pages@v5
            - uses: actions/upload-pages-artifact@v3
              with:
                  path: dist
            - id: deployment
              uses: actions/deploy-pages@v4
